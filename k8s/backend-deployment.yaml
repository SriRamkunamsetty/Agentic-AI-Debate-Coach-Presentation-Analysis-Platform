apiVersion: apps/v1
kind: Deployment
metadata:
  name: logos-backend
  namespace: logos-ai
  labels:
    app: logos-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: logos-backend
  template:
    metadata:
      labels:
        app: logos-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: backend
          image: ghcr.io/sriramkunamsetty/logos-ai/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: logos-ai-config
            - secretRef:
                name: logos-ai-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: logos-backend-service
  namespace: logos-ai
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: logos-backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: logos-backend-hpa
  namespace: logos-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: logos-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
