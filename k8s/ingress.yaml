apiVersion: apps/v1
kind: Deployment
metadata:
  name: logos-frontend
  namespace: logos-ai
  labels:
    app: logos-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: logos-frontend
  template:
    metadata:
      labels:
        app: logos-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/sriramkunamsetty/logos-ai/frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              value: "https://app.logos-ai.com/api/v1"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "800m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: logos-frontend-service
  namespace: logos-ai
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: logos-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: logos-ingress
  namespace: logos-ai
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "logos-backend-service"
spec:
  tls:
    - hosts:
        - app.logos-ai.com
      secretName: logos-ai-tls
  rules:
    - host: app.logos-ai.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: logos-backend-service
                port:
                  number: 8000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: logos-backend-service
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: logos-backend-service
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Prefix
            backend:
              service:
                name: logos-backend-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: logos-frontend-service
                port:
                  number: 3000
