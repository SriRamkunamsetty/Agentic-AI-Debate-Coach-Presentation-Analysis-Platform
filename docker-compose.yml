version: "3.9"

services:
  # Primary Relational ACID Database
  postgres:
    image: postgres:16-alpine
    container_name: logos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-logos_ai_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logos_ai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logos-network

  # In-Memory Cache & Distributed Task Broker
  redis:
    image: redis:7-alpine
    container_name: logos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logos-network

  # FastAPI Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: logos-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:-logos-ai-super-secret-production-key-2026}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass}@postgres:5432/${POSTGRES_DB:-logos_ai_db}
      SQLITE_FALLBACK_URL: sqlite:////app/data/logos_ai.db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      AI_PROVIDER: ${AI_PROVIDER:-heuristic}
      AI_MODEL: ${AI_MODEL:-gpt-5-mini}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PROMETHEUS_METRICS_ENABLED: "true"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logos-network

  # Celery Asynchronous Compute Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: logos-celery-worker
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info --concurrency=4 -Q audio,ai_agents,reports,celery
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass}@postgres:5432/${POSTGRES_DB:-logos_ai_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
      AI_PROVIDER: ${AI_PROVIDER:-heuristic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logos-network

  # Next.js 14 Web Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: logos-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - logos-network

  # Prometheus Metrics Scraper
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: logos-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - logos-network

  # Grafana Telemetry Dashboard
  grafana:
    image: grafana/grafana:10.3.3
    container_name: logos-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin_secure_pass}
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - logos-network

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  prometheus_data:
  grafana_data:

networks:
  logos-network:
    driver: bridge
