name: LOGOS.AI Continuous Integration (CI)

on:
  push:
    branches: [main, master, "develop/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-sast:
    name: Code Quality & Security (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Python Syntax & Lint Check (Ruff)
        run: |
          ruff check backend/ ai-ml/app/

      - name: Security Vulnerability Scan (Bandit SAST)
        run: |
          bandit -r backend/ -ll -i

      - name: Secret Leak Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  backend-tests:
    name: Backend & AI/ML Test Suite
    runs-on: ubuntu-latest
    needs: lint-and-sast
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r ai-ml/requirements.txt pytest-cov

      - name: Run Standalone AI/ML Offline Suite
        run: |
          python -m pytest -q ai-ml/tests/test_offline.py

      - name: Run Debate Arena & Swarm Engine Tests
        run: |
          python backend/tests/test_arena_engines.py

      - name: Run Backend Integration Tests
        run: |
          PYTHONPATH=backend python -m pytest backend/test_ai_backend.py --cov=backend

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    needs: lint-and-sast
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Next.js Production Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
        run: npm run build

  container-scan:
    name: Container Build & Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          load: true
          tags: logos-ai-backend:test

      - name: Scan Backend Image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "logos-ai-backend:test"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
